<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unity Defense Remastered</title>
<link rel="icon" href="icon-512.png">
<style>
/* Layout: the game's main menu. Full-screen chalk-lane battle behind a centred title, ribbon and one big download button. */
:root{--bg:#0a2419;--ink:#fff;--gold:#FFD700;--title:#FFE066;--pink:#FF1493;--pink2:#FF69B4;--display:"Arial Black","Arial Rounded MT Bold",Impact,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);overflow:hidden}
.menu{position:relative;height:100%;min-height:520px;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#17503a 0%,#0e3a28 55%,#07190f 100%);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 48%,rgba(0,0,0,.45) 0%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.4) 100%);pointer-events:none}
.main{position:relative;z-index:2;width:min(560px,94vw);display:flex;flex-direction:column;align-items:center;text-align:center}
.kicker{font-size:13px;font-weight:800;letter-spacing:3px;color:var(--gold);text-shadow:0 2px 6px #000}
h1{margin:4px 0 0;line-height:.92;font-weight:900;font-size:clamp(54px,11vw,96px);letter-spacing:2px;color:var(--title);text-wrap:balance;animation:bob 5s ease-in-out infinite;
 text-shadow:4px 4px 0 #000,-4px -4px 0 #000,4px -4px 0 #000,-4px 4px 0 #000,0 5px 0 #000,0 10px 0 #8a5a00,0 18px 30px rgba(0,0,0,.65)}
h1 span{display:block}h1 span+span{color:#fff}
.ribbon{margin-top:14px;padding:5px 26px;font-weight:900;letter-spacing:6px;font-size:15px;color:#1b1200;background:linear-gradient(135deg,var(--gold),#fff2a8);border:3px solid #000;border-radius:6px;transform:rotate(-2deg);box-shadow:0 5px 0 rgba(0,0,0,.5)}
.play{position:relative;overflow:hidden;margin-top:30px;width:min(420px,90vw);padding:14px 20px 12px;border:4px solid var(--gold);border-radius:22px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:2px;
 box-shadow:0 8px 0 rgba(0,0,0,.5),0 0 30px rgba(255,20,147,.55);transition:translate .15s,scale .15s,filter .15s,border-color .15s;animation:pulse 2.4s ease-in-out infinite}
.play b{font-size:34px;letter-spacing:4px;text-shadow:0 3px 0 rgba(0,0,0,.45)}
.play small{font-size:13px;font-weight:600;opacity:.92}
.play::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 3.6s 1s ease-in-out infinite}
.play:hover{translate:0 -4px;scale:1.03;border-color:#fff;filter:brightness(1.12)}
.play:focus-visible{outline:3px solid #fff;outline-offset:4px}
.play2{margin-top:16px;font-weight:900;letter-spacing:2px;font-size:15px;color:#fff;text-decoration:none;padding:10px 22px;border:3px solid #000;border-radius:14px;background:rgba(0,0,0,.55);box-shadow:0 5px 0 rgba(0,0,0,.5);transition:translate .15s,background .15s}
.play2:hover{translate:0 -3px;background:rgba(0,0,0,.75)}
.play2:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{box-shadow:0 8px 0 rgba(0,0,0,.5),0 0 44px rgba(255,20,147,.85)}}
@keyframes shine{0%{left:-60%}45%,100%{left:130%}}
@media (prefers-reduced-motion:reduce){h1,.play,.play::after{animation:none}}
</style>
<div class="menu">
  <video id="scene" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="menu-battle.webm" type="video/webm"><source src="menu-battle.mp4" type="video/mp4"></video>
  <div class="shade"></div>
  <div class="main">
    <div class="kicker">EARLY ACCESS</div>
    <h1><span>UNITY</span><span>DEFENSE</span></h1>
    <div class="ribbon">REMASTERED</div>
    <a class="play" id="downloadBtn" href="https://raw.githubusercontent.com/jaidendez69/Unity-Grammar-Defense-REMASTERED/main/releases/UnityGrammarDefense-Setup-latest.exe"><b>DOWNLOAD</b><small>For Windows &middot; Free &middot; v1.0.23</small></a>
    <a class="play2" href="play/">▶ Play in browser</a>
  </div>
</div>

</html>
