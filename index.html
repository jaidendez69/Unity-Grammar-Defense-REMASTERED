<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unity Grammar Defense — Download</title>
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --pink: #FF1493;
        --pink-light: #FF69B4;
        --gold: #FFD700;
        --green-light: #64FF64;
        --green-dark: #48D948;
        --bg-panel: rgba(10, 20, 12, 0.82);
        --text: #F5FFF2;
        --text-muted: #B8D8B4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
        height: 100%;
        overflow-x: hidden;
    }

    body {
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--text);
        background-color: var(--green-light);
        background-image:
            repeating-conic-gradient(var(--green-dark) 0% 25%, var(--green-light) 0% 50%);
        background-size: 80px 80px;
        min-height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }

    /* subtle darkening overlay so the checker pattern doesn't fight the panel */
    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.55) 100%);
        pointer-events: none;
        z-index: 1;
    }

    .stage {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        overflow: hidden;
    }

    .critter {
        position: absolute;
        will-change: transform;
    }

    .bob {
        animation: bob 2.4s ease-in-out infinite;
    }

    @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-10px); }
    }

    .drift-a { animation: driftA 22s linear infinite; }
    .drift-b { animation: driftB 26s linear infinite; }
    .drift-c { animation: driftC 30s linear infinite; }
    .drift-d { animation: driftD 19s linear infinite; }
    .drift-e { animation: driftE 24s linear infinite; }
    .drift-f { animation: driftF 28s linear infinite; }

    @keyframes driftA {
        0%   { transform: translate(-10vw, 10vh); }
        50%  { transform: translate(60vw, 22vh); }
        100% { transform: translate(-10vw, 10vh); }
    }
    @keyframes driftB {
        0%   { transform: translate(90vw, 70vh); }
        50%  { transform: translate(20vw, 78vh); }
        100% { transform: translate(90vw, 70vh); }
    }
    @keyframes driftC {
        0%   { transform: translate(15vw, 85vh); }
        50%  { transform: translate(75vw, 80vh); }
        100% { transform: translate(15vw, 85vh); }
    }
    @keyframes driftD {
        0%   { transform: translate(85vw, 15vh); }
        50%  { transform: translate(35vw, 8vh); }
        100% { transform: translate(85vw, 15vh); }
    }
    @keyframes driftE {
        0%   { transform: translate(5vw, 45vh); }
        50%  { transform: translate(30vw, 55vh); }
        100% { transform: translate(5vw, 45vh); }
    }
    @keyframes driftF {
        0%   { transform: translate(95vw, 40vh); }
        50%  { transform: translate(70vw, 30vh); }
        100% { transform: translate(95vw, 40vh); }
    }

    .panel {
        position: relative;
        z-index: 3;
        background: var(--bg-panel);
        border: 3px solid var(--gold);
        border-radius: 24px;
        padding: 44px 40px;
        max-width: 460px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        backdrop-filter: blur(2px);
    }

    .icon {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin: 0 auto 18px;
        display: block;
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    h1 {
        font-family: 'Fredoka', sans-serif;
        font-weight: 700;
        font-size: 30px;
        line-height: 1.15;
        color: white;
        margin-bottom: 6px;
    }

    .subtitle {
        font-family: 'Fredoka', sans-serif;
        font-weight: 500;
        font-size: 14px;
        letter-spacing: 0.5px;
        color: var(--gold);
        margin-bottom: 14px;
    }

    .tagline {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 28px;
        line-height: 1.5;
    }

    form {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    input[type="email"] {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 2px solid rgba(100, 255, 100, 0.4);
        background: rgba(255, 255, 255, 0.06);
        color: white;
        font-size: 15px;
        font-family: 'Inter', sans-serif;
        outline: none;
        transition: border-color 0.2s;
    }

    input[type="email"]::placeholder { color: rgba(245, 255, 242, 0.5); }
    input[type="email"]:focus { border-color: var(--gold); }

    button[type="submit"] {
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--pink), var(--pink-light));
        color: white;
        font-family: 'Fredoka', sans-serif;
        font-weight: 600;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
        border: 2px solid var(--gold);
    }

    button[type="submit"]:hover {
        transform: scale(1.03);
        box-shadow: 0 0 24px rgba(255, 20, 147, 0.6);
    }

    button[type="submit"]:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    .status {
        min-height: 20px;
        font-size: 13px;
        margin-top: 10px;
        font-weight: 500;
    }

    .status.success { color: var(--green-light); }
    .status.error { color: #FF6B6B; }

    .fine-print {
        margin-top: 22px;
        font-size: 11.5px;
        color: var(--text-muted);
        line-height: 1.5;
        border-top: 1px solid rgba(255,255,255,0.12);
        padding-top: 16px;
    }

    @media (max-width: 480px) {
        .panel { padding: 32px 24px; }
        h1 { font-size: 25px; }
        .critter { transform: scale(0.7); }
    }
</style>
</head>
<body>

                    <ellipse cx="32" cy="45" rx="20" ry="28" fill="#1A3A52"/>

        <div class="critter drift-f">

                <!-- Mrs Badui, smaller -->
                <svg width="48" height="60" viewBox="0 0 64 80">
                    <ellipse cx="32" cy="45" rx="20" ry="28" fill="#8B4513"/>
                    <circle cx="32" cy="17" r="3" fill="#3D2410"/>
                    <circle cx="32" cy="30" r="3" fill="#3D2410"/>

                    <circle cx="32" cy="20" r="19" fill="#FF1493"/>

    <div class="panel">
        <img src="icon-512.png" alt="Unity Grammar Defense" class="icon">
        <h1>Unity Grammar Defense</h1>
        <div class="subtitle">REMASTERED</div>
        <p class="tagline">Enter your email and we'll send you the download link for the Windows desktop app.</p>

        <form id="downloadForm">
            <input type="email" id="emailInput" placeholder="you@example.com" required>
            <button type="submit" id="submitBtn">📥 Send Me the Download</button>
            <div class="status" id="statusMsg"></div>
        </form>

        <div class="fine-print">
            Windows only, v1.0.4 · ~75MB · Free<br>
            Windows may show a SmartScreen warning since this isn't code-signed yet — click "More info" → "Run anyway" to continue.
        </div>
    </div>

    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>
        const EMAILJS_PUBLIC_KEY = 'kdRCGPik4q6r1wlqt';
        const EMAILJS_SERVICE_ID = 'service_9alli4s';
        const EMAILJS_TEMPLATE_ID = 'template_juq11gi';
        // The direct download link that gets sent in the email
        const DOWNLOAD_LINK = 'https://raw.githubusercontent.com/jaidendez69/Unity-Grammar-Defense-REMASTERED/main/releases/UnityGrammarDefense-Setup-1.0.4.exe';

        emailjs.init(EMAILJS_PUBLIC_KEY);

        const form = document.getElementById('downloadForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value.trim();
            if (!email) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';
            statusMsg.textContent = '';
            statusMsg.className = 'status';

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                to_email: email,
                download_link: DOWNLOAD_LINK
            }).then(function () {
                statusMsg.textContent = '✅ Check your inbox! Your download link is on its way.';
                statusMsg.className = 'status success';
                submitBtn.textContent = '📥 Send Me the Download';
                submitBtn.disabled = false;
                form.reset();
            }).catch(function (err) {
                statusMsg.textContent = '❌ Something went wrong - please try again.';
                statusMsg.className = 'status error';
                submitBtn.textContent = '📥 Send Me the Download';
                submitBtn.disabled = false;
                console.error(err);
            });
        });
    </script>
